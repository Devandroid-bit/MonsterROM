name: Import Exynos9825 Targets

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-exynos9825-targets
  cancel-in-progress: false

jobs:
  import-targets:
    name: Import Exynos9825 Targets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sixteenQPR2 branch
        uses: actions/checkout@v4
        with:
          ref: sixteenQPR2
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Clone source repository
        run: |
          git clone \
            --depth=1 \
            --branch sixteen \
            https://github.com/Devandroid-bit/DevandroidROM.git \
            source-repo

      - name: Import target
        run: |
          set -e

          SOURCE_DIR="source-repo/target"
          DEST_DIR="target"

          if [ ! -d "$SOURCE_DIR" ]; then
            echo "::error::Source directory does not exist: $SOURCE_DIR"
            exit 1
          fi

          echo "Removing existing target..."
          rm -rf "$DEST_DIR"

          echo "Creating destination directory..."
          mkdir -p "$DEST_DIR"

          echo "Copying target..."
          rsync -a --delete "$SOURCE_DIR/" "$DEST_DIR/"

          echo "target imported successfully."

      - name: Import platforms/exynos9825
        run: |
          set -e

          SOURCE_DIR="source-repo/platform/exynos9825"
          DEST_DIR="platform/exynos9825"

          if [ ! -d "$SOURCE_DIR" ]; then
            echo "::error::Source directory does not exist: $SOURCE_DIR"
            exit 1
          fi

          echo "Removing existing platforms/exynos9825..."
          rm -rf "$DEST_DIR"

          echo "Creating destination directory..."
          mkdir -p "$DEST_DIR"

          echo "Copying platform/exynos9825..."
          rsync -a --delete "$SOURCE_DIR/" "$DEST_DIR/"

          echo "platform/exynos9825 imported successfully."

      - name: Check imported files
        run: |
          echo "Target files:"
          find target -type f | wc -l

          echo "Exynos9825 files:"
          find platform/exynos9825 -type f | wc -l

      - name: Check for changes
        id: changes
        run: |
          git add -A target platform/exynos9825

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected."
          fi

      - name: Commit changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git commit \
            -m "init exynos9825 and targets" \
            -m "Credits: @Ocin4ever"

      - name: Rebase sixteenQPR2
        if: steps.changes.outputs.changed == 'true'
        run: |
          git fetch origin sixteenQPR2

          git rebase origin/sixteenQPR2

      - name: Push changes to sixteenQPR2
        if: steps.changes.outputs.changed == 'true'
        run: |
          git push --force-with-lease origin HEAD:sixteenQPR2

      - name: Cleanup
        if: always()
        run: |
          rm -rf source-repo
